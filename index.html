<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVeye Pricing Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --uveye-orange: #FF6B00;
            --uveye-black: #000000;
            --uveye-white: #FFFFFF;
            --bg-gray: #F9F9F9;
            --border-color: #E0E0E0;
            
            /* Typography Sizing Rules */
            --base-font-size: 16px;
            --header-font-size: 24px; /* 1.5x of base */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gray);
            color: var(--uveye-black);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .calculator-card {
            background: var(--uveye-white);
            max-width: 900px;
            width: 100%;
            border: 2px solid var(--uveye-black);
            padding: 40px;
            box-shadow: 10px 10px 0px var(--uveye-black);
        }

        h1 {
            color: var(--uveye-orange);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            border-bottom: 4px solid var(--uveye-orange);
            display: inline-block;
            padding-bottom: 10px;
        }

        /* SECTION HEADERS - 1.5x Hierarchy */
        .section-header {
            font-size: var(--header-font-size);
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        /* PICKLIST OPTIONS - Base Size */
        .option-label {
            font-size: var(--base-font-size);
            font-weight: 400;
        }

        .row-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .full-row {
            margin-bottom: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        select, .pick-option {
            width: 100%;
            padding: 15px;
            font-size: var(--base-font-size);
            border: 2px solid var(--uveye-black);
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .pick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .pick-option {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
        }

        .pick-option:hover {
            border-color: var(--uveye-orange);
        }

        input[type="radio"], input[type="checkbox"] {
            display: none;
        }

        input[type="radio"]:checked + .pick-option,
        input[type="checkbox"]:checked + .pick-option {
            background-color: var(--uveye-orange);
            color: white;
            border-color: var(--uveye-orange);
        }

        .subscription-callout {
            background-color: var(--uveye-black);
            color: white;
            padding: 20px;
            text-align: center;
            margin: 20px 0 40px 0;
        }

        .subscription-callout .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subscription-callout .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--uveye-orange);
        }

        /* Totals Area */
        .totals-container {
            background: #f0f0f0;
            padding: 30px;
            border-left: 8px solid var(--uveye-orange);
        }

        .total-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total-final {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--uveye-black);
            font-weight: 700;
            font-size: 28px;
        }

        .contract-term {
            margin-top: 10px;
            font-weight: 700;
            color: #666;
        }

        /* Footer */
        .footer-info {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--uveye-black);
            font-size: 14px;
            line-height: 1.6;
        }

        .footer-info h4 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .footer-list {
            list-style-type: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .footer-list li::before {
            content: "•";
            color: var(--uveye-orange);
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: -1em;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h1>
