<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVeye Pricing Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            max-width: 800px;
            width: 100%;
            background-color: white;
            padding: 40px;
            border: 2px solid orange;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: orange;
            font-size: 36px;
            margin-bottom: 40px;
        }

        .section-header {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: black;
        }

        .options {
            font-size: 16px;
            margin-bottom: 20px;
        }

        select, input[type="checkbox"] {
            font-size: 16px;
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        select:focus, input[type="checkbox"]:focus {
            outline: none;
            border-color: orange;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .half {
            width: 48%;
        }

        .full {
            width: 100%;
        }

        .total-section {
            margin-top: 40px;
            padding: 20px;
            background-color: #f8f8f8;
            border-radius: 10px;
        }

        .monthly-total {
            font-size: 24px;
            font-weight: 600;
            color: orange;
        }

        .one-time-fee {
            font-size: 20px;
            font-weight: 600;
            color: black;
            margin-top: 10px;
        }

        .contract-term {
            font-size: 18px;
            margin-top: 20px;
            text-align: center;
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #f8f8f8;
            border-radius: 10px;
            font-size: 14px;
            color: black;
        }

        .footer h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .apollo-section {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .apollo-section label {
            font-size: 16px;
            margin-left: 10px;
        }

        .subscription-total {
            font-size: 20px;
            font-weight: 600;
            color: black;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>UVeye Pricing Calculator</h1>

        <div class="row">
            <div class="half">
                <div class="section-header">Monthly Scans Per Unit</div>
                <select id="scans" class="options full">
                    <option value="6300">Up to 1,500 scans = $6,300/month</option>
                    <option value="6500">Up to 2,000 scans = $6,500/month</option>
                    <option value="6700">Up to 2,500 scans = $6,700/month</option>
                    <option value="6900">Up to 3,000 scans = $6,900/month</option>
                </select>
            </div>
            <div class="half">
                <div class="section-header">Number of Units</div>
                <select id="units" class="options full">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4
