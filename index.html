<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVeye | Solution Configurator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --uveye-blue: #00A3E0; /* UVeye Brand Blue */
            --dark-bg: #0f1113;
            --card-bg: #1a1d21;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border: #2d3136;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .calculator-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Logo Placeholder - Matches UVeye Pro style */
        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        .logo span { color: var(--uveye-blue); }

        .config-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .full-width { grid-column: 1 / -1; }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--uveye-blue);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        select, .checkbox-card {
            background: #25282c;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        select:focus { border-color: var(--uveye-blue); }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #25282c;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        /* Results Area */
        .summary-box {
            background: linear-gradient(145deg, #1e2227, #131518);
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border: 1px solid var(--uveye-blue);
        }

        .price-block { text-align: center; }
        .price-label { font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
        .price-value { font-size: 36px; font-weight: 700; }
        .one-time { color: #f8f9fa; }
        .monthly { color: var(--uveye-blue); }

        @media (max-width: 600px) {
            .config-section, .summary-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <div class="logo">UV<span>EYE</span></div>
        <p style="color: var(--text-dim)">Advanced Vehicle Inspection Systems</p>
    </div>

    <div class="config-section">
        <div class="input-group">
            <label>Number of Units</label>
            <select id="unitCount" onchange="calculate()">
                </select>
        </div>

        <div class="input-group">
            <label>Installation (One-Time Fee)</label>
            <select id="installType" onchange="calculate()">
                <option value="10500">Standard (Above Ground) - $10,500</option>
                <option value="20000">Pro (Under Ground) - $20,000</option>
            </select>
        </div>

        <div class="input-group">
            <label>Monthly Scan Volume Per Unit</label>
            <select id="scanTier" onchange="calculate()">
                <option value="6300">Up to 1,500 scans ($6,300/mo)</option>
                <option value="6500">Up to 2,000 scans ($6,500/mo)</option>
                <option value="6700">Up to 2,500 scans ($6,700/mo)</option>
                <option value="6900">Up to 3,000 scans ($6,900/mo)</option>
            </select>
        </div>

        <div class="input-group">
            <label>UV360 (Merchandising)</label>
            <select id="uv360" onchange="calculate()">
                <option value="0">Up to 50 Requests - Included</option>
                <option value="250">Up to 100 Requests - $250/mo</option>
                <option value="500">Up to 200 Requests - $500/mo</option>
                <option value="750">Up to 300 Requests - $750/mo</option>
            </select>
        </div>

        <div class="input-group full-width">
            <label>Optional Add-On</label>
            <div class="checkbox-container" onclick="toggleApollo()">
                <input type="checkbox" id="apolloAddon" onchange="calculate()">
                <span>Apollo - Interior 360 & OBD Capture (+$299/mo)</span>
            </div>
        </div>
    </div>

    <div class="summary-box">
        <div class="price-block" style="border-right: 1px solid #333">
            <div class="price-label">One-Time Installation</div>
            <div class="price-value one-time" id="totalInstall">$0</div>
        </div>
        <div class="price-block">
            <div class="price-label">Total Monthly Subscription</div>
            <div class="price-value monthly" id="totalMonthly">$0</div>
        </div>
    </div>

    <p style="text-align:center; font-size:11px; color:var(--text-dim); margin-top:20px;">
        *All prices are in USD. Monthly subscription includes hardware maintenance and cloud software.
    </p>
</div>

<script>
    // Populate Units 1-10
    const unitSelect = document.getElementById('unitCount');
    for (let i = 1; i <= 10; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = i + (i === 1 ? ' Scanning Lane' : ' Scanning Lanes');
        unitSelect.appendChild(opt);
    }

    function toggleApollo() {
        const cb = document.getElementById('apolloAddon');
        cb.checked = !cb.checked;
        calculate();
    }

    function calculate() {
        const units = parseInt(document.getElementById('unitCount').value);
        
        // One-time Calculation
        const installRate = parseInt(document.getElementById('installType').value);
        const totalInstall = installRate * units;

        // Monthly Calculation
        const scanRate = parseInt(document.getElementById('scanTier').value);
        const uv360Rate = parseInt(document.getElementById('uv360').value);
        const apolloRate = document.getElementById('apolloAddon').checked ? 299 : 0;

        const totalMonthly = (scanRate + uv360Rate + apolloRate) * units;

        // Display
        const formatter = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            maximumFractionDigits: 0
        });

        document.getElementById('totalInstall').innerText = formatter.format(totalInstall);
        document.getElementById('totalMonthly').innerText = formatter.format(totalMonthly);
    }

    // Run on load
    calculate();
</script>

</body>
</html>
