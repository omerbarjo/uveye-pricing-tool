<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVeye Pricing Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --uveye-orange: #FF5A00; /* Official UVeye Orange */
            --uveye-black: #000000;
            --uveye-gray: #1a1a1a;
            --text-main: #ffffff;
            --border: #333333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--uveye-black);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            margin: 0;
        }

        .calculator-card {
            background: var(--uveye-gray);
            width: 100%;
            max-width: 1000px;
            padding: 50px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-img {
            height: 50px; /* Sized for prominence */
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }

        .full-row {
            grid-column: 1 / -1;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 16px; /* Increased font size */
            font-weight: 700;
            color: var(--uveye-orange);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        select, .checkbox-container {
            background: #000000;
            border: 1px solid var(--border);
            color: white;
            padding: 16px;
            border-radius: 4px;
            font-size: 18px; /* Increased for legibility */
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus { border-color: var(--uveye-orange); }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .checkbox-container input {
            transform: scale(1.5);
            accent-color: var(--uveye-orange);
        }

        /* Results Summary */
        .summary-box {
            background: var(--uveye-orange);
            color: #000;
            border-radius: 4px;
            padding: 40px;
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .price-block { text-align: center; }
        .price-label { font-size: 14px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .price-value { font-size: 48px; font-weight: 800; }

        .term-text {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-top: 30px;
            color: var(--uveye-orange);
        }

        .whats-included {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }

        .whats-included h3 {
            color: var(--uveye-orange);
            font-size: 22px;
            margin-bottom: 20px;
        }

        .whats-included ul {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            list-style: none;
            padding: 0;
            font-size: 16px;
            color: #ccc;
        }

        .whats-included li::before {
            content: "✓";
            color: var(--uveye-orange);
            font-weight: bold;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .config-row, .summary-box, .whats-included ul { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <img src="https://uveye.com/wp-content/themes/uveye/assets/img/logo.svg" alt="UVeye Logo" class="logo-img">
        <h1>UVeye Pricing Calculator</h1>
    </div>

    <div class="config-row">
        <div class="input-group">
            <label>Number of UVeye Units</label>
            <select id="unitCount" onchange="calculate()">
                </select>
        </div>
        <div class="input-group">
            <label>Monthly Scan Volume Per Unit</label>
            <select id="scanTier" onchange="calculate()">
                <option value="6300">Up to 1,500 scans</option>
                <option value="6500">Up to 2,000 scans</option>
                <option value="6700">Up to 2,500 scans</option>
                <option value="6900">Up to 3,000 scans</option>
            </select>
        </div>
    </div>

    <div class="full-row">
        <div class="input-group">
            <label>Installation One Time Fee Per Lane</label>
            <select id="installType" onchange="calculate()">
                <option value="10500">Standard (Above Ground) - $10,500</option>
                <option value="20000">Pro (Under Ground) - $20,000</option>
            </select>
        </div>
    </div>

    <div class="config-row">
        <div class="input-group">
            <label>UV360 (Merchandising)</label>
            <select id="uv360" onchange="calculate()">
                <option value="0">Up to 50 Monthly Requests - Included</option>
                <option value="250">Up to 100 Monthly Requests - $250</option>
                <option value="500">Up to 200 Monthly Requests - $500</option>
                <option value="750">Up to 300 Monthly Requests - $750</option>
            </select>
        </div>
        <div class="input-group">
            <label>Optional Add-On</label>
            <div class="checkbox-container">
                <input type="checkbox" id="apolloAddon" onchange="calculate()">
                <span style="font-size: 16px; font-weight: 600;">Apollo - Interior 360 & OBD Capture (+$299/mo)</span>
            </div>
        </div>
    </div>

    <div class="summary-box">
        <div class="price-block">
            <div class="price-label">One-Time Installation
